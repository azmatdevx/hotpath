name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-skills.py
      - run: python3 skills/har-analysis/scripts/selftest.py
      - run: python3 skills/flow-from-test-case/scripts/selftest.py
      - run: python3 skills/web-vitals-audit/scripts/selftest.py
      - run: python3 skills/script-correlation/scripts/selftest.py
      - run: python3 skills/script-authoring/scripts/selftest.py
      - run: python3 skills/results-analysis/scripts/selftest.py
      - run: python3 skills/observability-analysis/scripts/selftest.py
      - run: python3 skills/sql-workload-analysis/scripts/selftest.py
      - run: python3 examples/hooks/claude-code/selftest.py
      - run: python3 scripts/test-install.py
